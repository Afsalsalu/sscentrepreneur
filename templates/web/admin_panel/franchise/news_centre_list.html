{% extends "web/admin_panel/base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'web/css/media_list.css' %}">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="relative min-h-screen group-data-[sidebar-size=sm]:min-h-sm">
<div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">        
    <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">
        <h4 class="py-5"></h4>
        <form action="#!" class="mb-5">
            <div class="grid grid-cols-1 gap-5 lg:grid-cols-12">
              <div class="relative lg:col-span-4 xl:col-span-3">
                <input
                  type="text"
                  class="ltr:pl-8 rtl:pr-8 search form-input border-slate-200 dark:border-zink-500 focus:outline-none focus:border-custom-500 disabled:bg-slate-100 dark:disabled:bg-zink-600 disabled:border-slate-300 dark:disabled:border-zink-500 dark:disabled:text-zink-200 disabled:text-slate-500 dark:text-zink-100 dark:bg-zink-700 dark:focus:border-custom-800 placeholder:text-slate-400 dark:placeholder:text-zink-200"
                  placeholder="Search for name, email, phone number etc..."
                  autocomplete="off"
                />
                <i
                  data-lucide="search"
                  class="inline-block size-4 absolute ltr:left-2.5 rtl:right-2.5 top-2.5 text-slate-500 dark:text-zink-200 fill-slate-100 dark:fill-zink-600"
                ></i>
              </div>
              <div class="lg:col-span-6 lg:col-start-10">
                <div class="flex gap-2 lg:justify-end">
                  <a href="{% url 'web:latest_news_add' %}">
                    <button
                      data-modal-target="addUserModal"
                      type="button"
                      class="text-white btn bg-custom-500 border-custom-500 hover:text-white hover:bg-custom-600 hover:border-custom-600 focus:text-white focus:bg-custom-600 focus:border-custom-600 focus:ring focus:ring-custom-100 active:text-white active:bg-custom-600 active:border-custom-600 active:ring active:ring-custom-100 dark:ring-custom-400/20"
                    >
                      <i data-lucide="plus" class="inline-block size-4"></i>
                      <span class="align-middle">Add latest news</span>
                    </button>
                  </a>
                </div>
                
              </div>
            </div>
          </form>

          <div class="container">
            {% for latestnews in latest_news %}
            <div class="box">
              <img src="{{ latestnews.image.url }}" alt="{{ m.title }}">
              <div class="content">
                <h2>{{ latestnews.title }}</h2>
                <p>{{ latestnews.content }}</p>
                <div class="py-3"></div>
                <a href="#" class="as edit-link" data-edit-url="{% url 'web:latest_news_edit' latestnews.id %}">Edit</a>
                <a href="#" class="as delete-link" data-delete-url="{% url 'web:latest_news_delete' latestnews.id %}">Delete</a>
              </div>
              <div class="py-2"></div>
            </div>
            {% endfor %}
            <div class="py-2"></div>
          </div>

        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
      // Handle delete confirmation
      const deleteLinks = document.querySelectorAll(".delete-link");
      deleteLinks.forEach(link => {
          link.addEventListener("click", function(e) {
              e.preventDefault();
              const deleteUrl = this.dataset.deleteUrl;
  
              Swal.fire({
                  title: 'Are you sure?',
                  text: "You won't be able to revert this!",
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonColor: '#3085d6',
                  cancelButtonColor: '#d33',
                  confirmButtonText: 'Yes, delete it!'
              }).then((result) => {
                  if (result.isConfirmed) {
                      window.location.href = deleteUrl;
                  }
              });
          });
      });
  
      // Handle edit confirmation
      const editLinks = document.querySelectorAll(".edit-link");
      editLinks.forEach(link => {
          link.addEventListener("click", function(e) {
              e.preventDefault();
              const editUrl = this.dataset.editUrl;
  
              Swal.fire({
                  title: 'Do you want to edit this entry?',
                  icon: 'question',
                  showCancelButton: true,
                  confirmButtonColor: '#3085d6',
                  cancelButtonColor: '#d33',
                  confirmButtonText: 'Edit',
                  cancelButtonText: 'Back'
              }).then((result) => {
                  if (result.isConfirmed) {
                      window.location.href = editUrl;
                  }
              });
          });
      });
    });
  </script>
{% endblock %}
