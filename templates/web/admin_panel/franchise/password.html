<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre User List</title>
</head>
<body>
    <h1>Centre User List</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Formatted ID</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for user in centre_users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.formatted_id }}</td>
                <td>
                    <form action="{% url 'web:send_user_credentials' user.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Send Credentials</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
