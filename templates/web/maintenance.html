{% load static %}

<!DOCTYPE html>
<html lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">

<head>

    <meta charset="utf-8">
    <title>Maintenance | Samatwa Service Centre Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta content="Minimal Admin & Dashboard Template" name="description">
    <meta content="Themesdesign" name="author">
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    <!-- Layout config Js -->
    <script src="{% static 'web/js/layout.js' %}"></script>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'web/css/tailwind2.css' %}">
</head>

<body class="flex items-center justify-center min-h-screen py-16 bg-cover bg-auth-pattern dark:bg-auth-pattern-dark font-public">

    <div class="mb-0 border-none shadow-none lg:w-[500px] card bg-white/70 dark:bg-zink-500/70">
        <div class="!px-10 !py-12 card-body">

            <div class="mt-10">
                <img src="{% static 'web/images/maintenance.png' %}" alt="" class="mx-auto h-72">
            </div>
            <div class="mt-8 text-center">
                <h4 class="mb-2 text-purple-500">Currently in Maintenance Mode !!!</h4>
                <p class="mb-1 text-slate-500 dark:text-zink-200">Website is Under Construction. Please check back later!</p>
                <p class="mb-6 text-slate-500 dark:text-zink-200">In a few days, everything will be clear and your services will start. Thanks for your patience!</p>
                <a href="{% url 'web:index' %}" class="text-white btn bg-custom-500 border-custom-500 hover:text-white hover:bg-custom-600 hover:border-custom-600 focus:text-white focus:bg-custom-600 focus:border-custom-600 focus:ring focus:ring-custom-100 active:text-white active:bg-custom-600 active:border-custom-600 active:ring active:ring-custom-100 dark:ring-custom-400/20"><i data-lucide="home" class="inline-block size-3 ltr:mr-1 rtl:ml-1"></i> <span class="align-middle">Back to Home</span></a>
            </div>
        </div>
    </div>

    <script src="{% static 'web/libs/choices.js/public/assets/scripts/choices.min.js' %}"></script>
    <script src="{% static 'web/libs/%40popperjs/core/umd/popper.min.js' %}"></script>
    <script src="{% static 'web/libs/tippy.js/tippy-bundle.umd.min.js' %}"></script>
    <script src="{% static 'web/libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'web/libs/prismjs/prism.js' %}"></script>
    <script src="{% static 'web/libs/lucide/umd/lucide.js' %}"></script>
    <script src="{% static 'web/js/tailwick.bundle.js' %}"></script>
</body>

</html>
