{% extends "web/franchise/base.html" %}
{% load static %}

{% block content %}

<div class="relative min-h-screen group-data-[sidebar-size=sm]:min-h-sm">
  <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">       
    <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">
      <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
        <div class="grow">
          <h5 class="text-16">Select Payment Method</h5>
        </div>
        <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
          <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
            <a href="#!" class="text-slate-400 dark:text-zink-200">Forms</a>
          </li>
          <li class="text-slate-700 dark:text-zink-100">
            Select Payment Method
          </li>
        </ul>
      </div>
      <div class="grid grid-cols-1 gap-x-5 xl:grid-cols-3">
        <div class="card">
          <div class="card-body">
            <form method="POST" action="{% url 'web:payment' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label for="inputText" class="inline-block mb-2 text-base font-medium">Enter Amount: <span class="text-red-500">*</span></label>
                <label for="amount"></label>
                <div class="col-xl-4 col-md-6 col-sm-12 mb-4">
                  <br><div class="col-xl-4 col-md-6 col-sm-12 mb-4 widsa">
                    <input type="number" id="amount" name="amount" id="inputText" class="form-control form-input border-slate-200 dark:border-zink-500 focus:outline-none focus:border-custom-500 disabled:bg-slate-100 dark:disabled:bg-zink-600 disabled:border-slate-300 dark:disabled:border-zink-500 dark:disabled:text-zink-200 disabled:text-slate-500 dark:text-zink-100 dark:bg-zink-700 dark:focus:border-custom-800 placeholder:text-slate-400 dark:placeholder:text-zink-200" required>
                  </div>
                </div>
                <button type="submit" class="text-white btn bg-custom-500 border-custom-500 hover:text-white hover:bg-custom-600 hover:border-custom-600 focus:text-white focus:bg-custom-600 focus:border-custom-600 focus:ring focus:ring-custom-100 active:text-white active:bg-custom-600 active:border-custom-600 active:ring active:ring-custom-100 dark:ring-custom-400/20">Proceed to Payment</button>
              </form> 
            </div>
          </div><!--end card-->
        </div><!--end grid-->
      </div>
</div>

  <!-- End Page-wrapper -->

{% endblock %}
