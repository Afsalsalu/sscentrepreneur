{% extends "web/franchise/base.html" %}
{% load static %}

{% block content %}

<div class="relative min-h-screen group-data-[sidebar-size=sm]:min-h-sm">
  <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">  
    <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">     
      <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
        <div class="mb-0 border-none shadow-none lg:w-[500px] card bg-white/70 dark:bg-zink-500/70">
          <div class="!px-10 !py-12 card-body">
            <div class="mt-10"> 
              <img src="{% static 'web/images/service/banks.png' %}" alt="" class="mx-auto h-72">
            </div>
            <div class="mt-8 text-center">
              <h4 class="mb-2 text-purple-500">Payment !!!</h4>
              <p class="mb-6 text-slate-500 dark:text-zink-200">Wallet Add to Money !</p>
              <a href="{% url 'web:centre_dashboard' %}" class="text-white btn bg-custom-500 border-custom-500 hover:text-white hover:bg-custom-600 hover:border-custom-600 focus:text-white focus:bg-custom-600 focus:border-custom-600 focus:ring focus:ring-custom-100 active:text-white active:bg-custom-600 active:border-custom-600 active:ring active:ring-custom-100 dark:ring-custom-400/20"><i data-lucide="home" class="inline-block size-3 ltr:mr-1 rtl:ml-1"></i> <span class="align-middle">Back to Home</span></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<!-- Razorpay payment form -->
<script>
    var options = {
        "key": "{{ settings.RAZORPAY_API_KEY }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "Your Company Name",
        "description": "Payment Description",
        "order_id": "{{ order_id }}",
        "handler": function(response) {
            // Handle the payment success response
            // You can submit the form or redirect to a success page
            document.forms[0].submit();
        },
        "prefill": {
            "name": "John Doe",
            "email": "john@example.com",
            "contact": "9876543210"
        }
    };
    var rzp = new Razorpay(options);
    rzp.open();
</script>


{% endblock %}
