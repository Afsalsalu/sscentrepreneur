{% block content %}

<div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">


<div class="relative min-h-screen group-data-[sidebar-size=sm]:min-h-sm">

    <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">        
        <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">

            <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                <div class="grow">
                    <h5 class="text-16">Wallet History</h5>
                </div>
                <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                    <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                        <a href="#!" class="text-slate-400 dark:text-zink-200">Tables</a>
                    </li>
                    <li class="text-slate-700 dark:text-zink-100">
                        Wallet History
                    </li>
                </ul>
            </div>
            <div class="px-4 py-3 mb-4 text-sm text-red-500 border border-transparent rounded-md bg-red-50 dark:bg-red-400/20">
                This is <b>SSC</b> page in which we have used <b>Wallet </b> Payment History!
            </div>

            <div class="card">
                <div class="card-body">
                    <h6 class="mb-4 text-15">History</h6>
                    <table class="inputs">
                        <tbody>
                            <tr>
                                <td>
                                    <div class="grid grid-cols-2 gap-3 mb-3">
                                        <div>
                                            <label for="min" class="inline-block mb-2 text-base font-medium">Start Date:</label>
                                            <input class="form-input border-slate-200 dark:border-zink-500 focus:outline-none focus:border-custom-500 disabled:bg-slate-100 dark:disabled:bg-zink-600 disabled:border-slate-300 dark:disabled:border-zink-500 dark:disabled:text-zink-200 disabled:text-slate-500 dark:text-zink-100 dark:bg-zink-700 dark:focus:border-custom-800 placeholder:text-slate-400 dark:placeholder:text-zink-200" type="date" id="min" name="min">
                                        </div>
                                        <div>
                                            <label for="max" class="inline-block mb-2 text-base font-medium">End Date:</label>
                                            <input class="form-input border-slate-200 dark:border-zink-500 focus:outline-none focus:border-custom-500 disabled:bg-slate-100 dark:disabled:bg-zink-600 disabled:border-slate-300 dark:disabled:border-zink-500 dark:disabled:text-zink-200 disabled:text-slate-500 dark:text-zink-100 dark:bg-zink-700 dark:focus:border-custom-800 placeholder:text-slate-400 dark:placeholder:text-zink-200" type="date" id="max" name="max" >
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <table id="basic_tables" class="display stripe group" style="width:100%">
                        <thead>
                            <tr >
                                <th class="ltr:!text-left rtl:!text-right">Date</th>
                                <th>Amount</th>
                                <th>Trans ID</th>
                                <th>Bank Name</th>
                                <th>Branch</th>
                                <th>Type</th>
                                <th>Mode</th>
                                <th>Status</th>
                                <th>Query Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>


               
            
                        </tbody>

                    </table>
                </div>
            </div><!--end card-->

  


  
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-wrapper -->


</div>

</div>

<script src="{% static 'web/js/datatables/jquery-3.7.0.js' %}"></script>

<script src="{% static 'web/js/datatables/buttons.html5.min.js' %}"></script>
