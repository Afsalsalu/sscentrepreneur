{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Certificate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100% !important;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow: hidden;
            background-color: aqua;
        }
        p {
            margin: 0 !important;
            padding: 0 !important;
        }
        .card {
            width: 100%;
            height: 100%;
            position: absolute; /* Use absolute positioning to cover the viewport */
            top: 0;
            left: 0;
            padding: 0 !important;
            margin: 0 !important;
            background-image: url({{ image_url }});
            background-repeat: no-repeat;
            background-size: cover; /* Ensure the background image covers the entire card */
            background-position: center;
            font-family: "Poppins-Regular";
            overflow: hidden;
        }
        .content {
            position: absolute;
            top: 39.6%;
            left: 30.2%;
            font-size: 32px;
            font-weight: 600;
            color: #ff0000d9;
        }
        .district {
            position: absolute;
            top: 59.0%;
            left: 11.5%;
            font-size: 32px;
            font-weight: 600;
            color: #000000d9;
        }
        .state {
            position: absolute;
            top: 59.0%;
            left: 43.6%;
            font-size: 32px;
            font-weight: 600;
            color: #000000d9;
        }
        .photo {
            position: absolute;
            top: 20.9%;
            left: 83.2%;
            font-size: 32px;
            font-weight: 600;
            color: #000000d9;
        }
        .formatted_id {
            position: absolute;
            top: 23.1%;
            left: 12.2%;
            font-size: 32px;
            font-weight: 600;
            color: #000000d9;
        }
        #current-date {
            position: absolute;
            top: 69.0%;
            left: 23.6%;
            font-size: 32px;
            font-weight: 600;
            color: #000000d9;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="formatted_id">
            <p>{{ formatted_id }}</p>
        </div> 
        <div class="content">
            <p>{{ content }}</p>
        </div>      
        <div class="district">
            <p>{{ district }}</p>
        </div>  
        <div class="state">
            <p>{{ state }}</p>
        </div>  
        <div class="photo">
            <img src="{{ photo }}" alt="User Photo" style="width: 127px; height: auto;">
        </div>
        <p id="current-date"></p>
    </div>

    <script>
        // Function to format the current date
        function getFormattedDate() {
            const currentDate = new Date();
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0'); // Months are zero-based
            const day = String(currentDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        // Display the formatted date in the paragraph with id 'current-date'
        document.getElementById('current-date').textContent = getFormattedDate();
    </script>
</body>
</html>
