<!DOCTYPE html>
<html>
<head>
    <title>Analytics Report</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Google Analytics Report</h1>
    <table>
        <thead>
            <tr>
                <th>Country</th>
                <th>Sessions</th>
            </tr>
        </thead>
        <tbody>
            {% for row in report.reports.0.data.rows %}
            <tr>
                <td>{{ row.dimensions.0 }}</td>
                <td>{{ row.metrics.0.values.0 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
