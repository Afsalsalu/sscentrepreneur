{% extends "web/home/base.html" %}
{% load static %}
{% block content %}


<div class="container">
    <div class="py-5"></div>
    <div class="py-5"></div>
    <div class="py-5"></div>
    <div class="container text-center">
        <div class="row justify-content-md-center">
            <div class="col col-lg-2">





                <button id="rzp-button1">Pay</button>
                <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
                <script>
                    var options = {
                        "key": "{{ razorpay_key_id }}", // Enter the Key ID generated from the Dashboard
                        "amount": "10", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
                        "currency": "INR",
                        "name": "Samatwa Service Centre", //your business name
                        "description": "Registration Payment",
                        "image": "https://sscegov.com/home/janakagr/public_html/webssc/static/web/file/images/logoSSC-blue.png",
                        "order_id": "{{ payment.id }}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
                        "callback_url": "https://eneqd3r9zrjok.x.pipedream.net/",
                        "prefill": { //We recommend using the prefill parameter to auto-fill customer's contact information especially their phone number
                            "name": "{{ user_registration.name }}", //your customer's name
                            "email": "{{ user_registration.email }}",
                            "contact": "{{ user_registration.mobile }}" //Provide the customer's phone number for better conversion rates 
                        },
                        "notes": {
                            "address": "Razorpay Corporate Office"
                        },
                        "theme": {
                            "color": "#4582b5"
                        }
                    };
                    var rzp1 = new Razorpay(options);
                    document.getElementById('rzp-button1').onclick = function (e) {
                        rzp1.open();
                        e.preventDefault();
                    }
                </script>







            </div>
        </div>
    </div>
</div>

{% endblock %}
