<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My SSC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Global Styling */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #d9e6f2, #ffffff); /* Light gradient background */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            height: 100vh;
            justify-content: center;
        }

        h1 {
            margin-top: 30px;
            color: #2c3e50; /* Darker heading color */
            font-size: 3em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            text-align: center;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        /* Styling for dropdowns */
        .dropdown-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        select {
            margin: 10px;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            width: 200px;
        }

        select:hover {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
        }

        select:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.7);
        }

        /* Map Styling */
        #map {
            height: 59vh;
            width: 100%;
            margin: 30px auto;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
        }

        /* Popup Styling */
        .leaflet-popup-content {
            font-size: 14px;
            color: #333;
        }

        .leaflet-popup-content h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }

        .leaflet-popup-content p {
            margin: 5px 0;
        }

        .popup-title {
            color: #007bff;
        }

        .highlighted {
            color: #007bff;
            weight: 2;
            fillOpacity: 0.3;
            fillColor: #007bff;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .dropdown-container {
                flex-direction: column;
                gap: 10px;
            }

            select {
                width: 90%;
                margin-bottom: 15px;
            }
        }

        /* Tooltip and hover effects for Map */
        .leaflet-tooltip {
            background-color: #333;
            color: white;
            font-size: 12px;
            border-radius: 5px;
        }

        /* Button Styling */
        .button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .button:hover {
            background-color: #0056b3;
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.5);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Find My SSC</h1>
        <div class="dropdown-container">
            <select id="stateSelect">
                <option value="">Select State</option>
            </select>

            <select id="districtSelect">
                <option value="">Select District</option>
            </select>
        </div>

        <div id="map"></div>

        <button class="button" id="resetButton">Reset Map</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([23.5937, 78.9629], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // The user location data passed from Django view
        var users = {{ users|safe }};  // `users` is passed as a JSON object

        // Mark the users' locations on the map
        users.forEach(function(user) {
            L.marker([user.location_lat, user.location_lon]).addTo(map)
                .bindPopup(`<h3>User ID: ${user.id}</h3><p>Owner: ${user.owner}</p>`);
        });

        let indiaGeoJSONData; // To store the fetched data

        // Fetch India GeoJSON Data from GitHub
        fetch('https://raw.githubusercontent.com/udit-001/india-maps-data/main/geojson/india.geojson')
            .then(response => response.json())
            .then(data => {
                indiaGeoJSONData = data; // Store the fetched data
                L.geoJson(data, {
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup(`<h3 class="popup-title">${feature.properties.district}</h3><p>${feature.properties.st_nm}</p>`);
                    }
                }).addTo(map);

                // Populate State Dropdown dynamically based on data
                populateStateDropdown(data);
            });

        // Populate State Dropdown with data from GeoJSON
        function populateStateDropdown(data) {
            var stateSelect = document.getElementById("stateSelect");
            let states = [];

            // Collect unique states
            data.features.forEach(state => {
                let stateName = state.properties.st_nm;
                if (!states.includes(stateName)) {
                    states.push(stateName);
                    var option = document.createElement("option");
                    option.value = stateName;
                    option.textContent = stateName;
                    stateSelect.appendChild(option);
                }
            });
        }

        // Handle State Selection
        document.getElementById("stateSelect").addEventListener("change", function () {
            var stateName = this.value;
            if (stateName) {
                // Show districts within selected state on map
                showStateDistrictsOnMap(stateName);
            } else {
                // Reset map if no state is selected
                resetMap();
            }
        });

        function showStateDistrictsOnMap(stateName) {
            // Reset the map by clearing previous states
            map.eachLayer(function(layer) {
                if (layer instanceof L.GeoJSON) {
                    map.removeLayer(layer);
                }
            });

            let selectedState = indiaGeoJSONData.features.filter(state => state.properties.st_nm === stateName);

            // Filter and display only the districts in the selected state
            selectedState.forEach(state => {
                L.geoJson(state).addTo(map);
                map.fitBounds(L.geoJson(state).getBounds()); // Zoom into the selected state
            });

            // Populate district dropdown based on selected state
            populateDistrictDropdown(selectedState);
        }

        // Function to populate the district dropdown based on the selected state
        function populateDistrictDropdown(stateData) {
            var districtSelect = document.getElementById("districtSelect");
            districtSelect.innerHTML = '<option value="">Select District</option>'; // Reset dropdown

            let districts = [];

            // Collect unique districts from the selected state's data
            stateData.forEach(state => {
                let districtName = state.properties.district;
                if (!districts.includes(districtName)) {
                    districts.push(districtName);
                    var option = document.createElement("option");
                    option.value = districtName;
                    option.textContent = districtName;
                    districtSelect.appendChild(option);
                }
            });
        }

        // Handle District Selection
        document.getElementById("districtSelect").addEventListener("change", function () {
            var districtName = this.value;
            if (districtName) {
                // Show district on map based on selection
                showDistrictOnMap(districtName);
            }
        });

        // Function to show selected district on the map
        function showDistrictOnMap(districtName) {
            // Reset the map by clearing previous districts
            map.eachLayer(function(layer) {
                if (layer instanceof L.GeoJSON) {
                    map.removeLayer(layer);
                }
            });

            let selectedDistrict = indiaGeoJSONData.features.filter(district => district.properties.district === districtName);

            // Filter and display only the selected district with a custom style
            selectedDistrict.forEach(district => {
                L.geoJson(district, {
                    style: function (feature) {
                        return {
                            color: "#007bff",  // Keeping color as blue
                            weight: 2,
                            fillOpacity: 0.1,  // Slightly transparent to keep original color
                            fillColor: "#007bff"
                        };
                    }
                }).addTo(map);

                map.fitBounds(L.geoJson(district).getBounds()); // Zoom into the selected district
            });
        }

        // Function to reset the map view
        function resetMap() {
            map.eachLayer(function(layer) {
                if (layer instanceof L.GeoJSON) {
                    map.removeLayer(layer);
                }
            });

            map.setView([20.5937, 78.9629], 5); // Reset to the center of India
        }

        // Reset button functionality
        document.getElementById('resetButton').addEventListener('click', resetMap);
    </script>
</body>
</html>
