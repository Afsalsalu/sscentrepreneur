{% extends "web/exam/exam/base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'web/dashboard/assets/css/userlogin.css' %}">
<style>
    
    body{
        background-color: #284478;
    }

    .form-wrap {
        position: relative;
        padding: 40px;
        background-color: white;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        z-index: 10;
    }

    .form-wrap::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("{% static 'web/file/images/logoSSC-blue.png' %}");
        background-size: 300px;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.1; /* Lower the opacity for a more transparent image */
        z-index: -1;
    }

    #title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #284478;
    }

    .form-control {
        height: 50px;
        border-radius: 5px;
        border: 1px solid #9c9797;
        padding: 10px;
        margin-bottom: 15px;
        background-color: transparent;
    }

    .form-control:focus {
        border-color: #284478;
        box-shadow: 0 0 5px rgba(40, 68, 120, 0.5);
    }

    .buttonF {
        background-color: #284478;
        color: white;
        font-weight: bold;
        border-radius: 5px;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .buttonF:hover {
        background-color: #1d3b6d;
    }

    .form-group {
        margin-bottom: 20px;
    }

    hr {
        border: 0;
        border-top: 1px solid #ccc;
        margin-top: 20px;
        margin-bottom: 20px;
    }

    p {
        text-align: center;
        font-size: 14px;
    }

    p a {
        color: #284478;
        text-decoration: none;
    }

    p a:hover {
        text-decoration: underline;
    }

    /* .container {
        max-width: 600px;
        margin: 0 auto;
    } */
</style>

<div class="container">
    <div class="py-5"></div>
    <div class="py-2"></div>

    <div class="form-wrap"> 
        <h4 id="title" class="text-center">Main Exam Login User</h4>
        <hr>
        <form method="post" id="login-form" action="{% url 'exam:main_exam_login' %}">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="username">TEC Certificate Number :</label>
                        <input type="text" name="username" id="username"  class="form-control" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="password">Password :</label>
                        <input type="password" name="password" id="password"  class="form-control" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 text-left">
                    <button type="submit" id="submit" class="buttonF" style="width: max-content;">Submit & Login</button>
                </div>  
            </div>
            <div class="py-3"></div>
        </form>
        <!-- <p>New here? <a href="{% url 'exam:entrepreneur_register' %}">Register</a> to create an account.</p> -->
        <!-- <p>Forgot your password? <a href="#!">Reset it here</a>.</p> -->
    </div>
</div>
<div class="py-5"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
